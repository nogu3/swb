[package]
name = "swb"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "UNIX-philosophy CLI for SwitchBot devices (BLE passive scan + Cloud API v1.1)"
repository = "https://github.com/nogu3/swb"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
btleplug = "0.11"
tokio = { version = "1", features = ["rt", "time"] }
futures = "0.3"
ureq = "2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[features]
# Build libdbus from source for hosts without libdbus-1-dev/pkg-config.
vendored-dbus = ["dbus/vendored"]

[profile.release]
lto = true
strip = true
opt-level = "z"
